<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hán Ngữ Vui – Học tiếng Trung</title>
<style>
:root{--bg:#F2F6F5;--card:#fff;--ink:#14213D;--mut:#5B6B7F;--jade:#0F8B6D;--jade2:#0B6B54;--red:#D64545;--redbg:#FCE8E8;--gold:#F2B134;--line:#D5DEDC;--okbg:#DDF3EA;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1A24;--card:#16283A;--ink:#EAF1F5;--mut:#9DB0C0;--jade:#2BC49A;--jade2:#1B9B79;--red:#FF7676;--redbg:#3A2024;--line:#2A4054;--okbg:#12382F}}
:root[data-theme="dark"]{--bg:#0E1A24;--card:#16283A;--ink:#EAF1F5;--mut:#9DB0C0;--jade:#2BC49A;--jade2:#1B9B79;--red:#FF7676;--redbg:#3A2024;--line:#2A4054;--okbg:#12382F}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
.zh{font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif}
#app{max-width:480px;margin:0 auto;padding:16px 16px 40px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.top h1{font-size:1.25rem;margin:0}
.stats{display:flex;gap:10px;font-weight:700}
.stats span{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:.9rem}
.goal{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:12px 0 4px}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--jade);transition:width .4s}
.unit{margin:22px 0 6px;padding:12px 14px;background:var(--jade);color:#fff;border-radius:12px}
.unit b{display:block;font-size:1.05rem}.unit small{opacity:.9}
.path{display:flex;flex-direction:column;gap:14px;align-items:center;padding:18px 0}
.node{width:76px;height:76px;border-radius:50%;border:0;background:var(--jade);color:#fff;font-size:1.9rem;box-shadow:0 6px 0 var(--jade2);position:relative}
.node:active{transform:translateY(4px);box-shadow:0 2px 0 var(--jade2)}
.node.done{background:var(--gold);box-shadow:0 6px 0 #C48A12;color:#4A3500}
.node.lock{background:var(--line);box-shadow:0 6px 0 #B7C3C0;color:var(--mut);cursor:not-allowed}
.node:nth-child(odd){transform:translateX(-34px)}.node:nth-child(even){transform:translateX(34px)}
.node:nth-child(odd):active{transform:translate(-34px,4px)}.node:nth-child(even):active{transform:translate(34px,4px)}
.nl{font-size:.8rem;color:var(--mut);text-align:center;margin-top:-6px}
.reset{background:none;border:0;color:var(--mut);text-decoration:underline;margin-top:20px;font-size:.85rem}
.lhead{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.lhead .bar{flex:1;margin:0}
.x{background:none;border:0;font-size:1.4rem;color:var(--mut)}
.q h2{font-size:1.15rem;margin:0 0 16px}
.big{font-size:3.2rem;text-align:center;margin:10px 0 2px;line-height:1.2}
.py{text-align:center;color:var(--mut);margin-bottom:14px}
.spk{display:block;margin:0 auto 16px;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:10px 22px;font-size:1.1rem}
.opts{display:grid;gap:10px}
.opt{background:var(--card);border:2px solid var(--line);border-bottom-width:4px;border-radius:12px;padding:14px;text-align:left;font-size:1.05rem}
.opt:hover{border-color:var(--jade)}
.opt.sel{border-color:var(--jade);background:var(--okbg)}
.opt.ok{border-color:var(--jade);background:var(--okbg)}.opt.bad{border-color:var(--red);background:var(--redbg)}
.opt small{display:block;color:var(--mut);font-size:.8rem}
.ans{min-height:64px;border-bottom:2px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;padding:8px 0;margin-bottom:16px;align-items:center}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{background:var(--card);border:2px solid var(--line);border-bottom-width:4px;border-radius:10px;padding:8px 14px;font-size:1.2rem;text-align:center}
.chip small{display:block;font-size:.7rem;color:var(--mut)}
.chip.used{visibility:hidden}
.foot{position:fixed;left:0;right:0;bottom:0;padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line)}
.foot>div{max-width:480px;margin:0 auto}
.foot.ok{background:var(--okbg)}.foot.bad{background:var(--redbg)}
.msg{font-weight:700;margin-bottom:8px}
.go{width:100%;border:0;border-radius:12px;background:var(--jade);color:#fff;font-weight:700;font-size:1.05rem;padding:14px;box-shadow:0 4px 0 var(--jade2)}
.go:disabled{background:var(--line);color:var(--mut);box-shadow:none;cursor:not-allowed}
.foot.bad .go{background:var(--red);box-shadow:0 4px 0 #A83030}
.end{text-align:center;padding-top:40px}.end .big{font-size:4rem}
.sum{display:flex;gap:12px;justify-content:center;margin:20px 0}
.sum div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 18px;font-weight:700}
.pad{height:130px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

:root{--bg:#EEF1F8;--ink:#1A2340}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0C1322}}
:root[data-theme="dark"]{--bg:#0C1322}
#app{max-width:520px}
.hd{display:flex;align-items:center;gap:12px;background:#1A2340;color:#fff;margin:-16px -16px 16px;padding:18px 16px;border-radius:0 0 22px 22px}
.hd h1{margin:0;font-size:1.2rem}.hd small{opacity:.75}.hd .stats{margin-left:auto}.hd .stats span{background:rgba(255,255,255,.12);border-color:transparent}
.logo{width:46px;height:46px;background:#C8372D;border-radius:10px;display:grid;place-items:center;font-size:1.7rem;font-weight:700;transform:rotate(-4deg)}
.hero{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
.hero small{color:var(--mut);display:block}.hero b{font-size:1.1rem}
.ring{width:62px;height:62px;border-radius:50%;background:conic-gradient(var(--jade) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center}
.ring span{width:48px;height:48px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-weight:700;font-size:.85rem}
.uc{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-bottom-width:4px;border-radius:16px;padding:14px;margin-bottom:10px}
.uc:hover:not(.lock){border-color:var(--jade)}
.uc .ic{font-size:1.7rem;width:52px;height:52px;display:grid;place-items:center;background:var(--bg);border-radius:14px}
.uc .tx{flex:1}.uc .tx b{display:block}.uc .tx small{color:var(--mut)}
.uc .st{font-weight:700;color:var(--jade);font-size:.85rem}
.uc.done .ic{background:var(--okbg)}.uc.lock{opacity:.55;cursor:not-allowed}
.srch{width:100%;font:inherit;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);margin-bottom:12px}
.dict{display:grid;gap:8px}
.dw{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px;text-align:left}
.dw .zh{font-size:1.6rem;min-width:84px}.dw span:nth-child(2){flex:1}.dw small{display:block;color:var(--mut)}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:8px;background:var(--card);border-top:1px solid var(--line);padding:8px 16px calc(8px + env(safe-area-inset-bottom,0px))}
.tabs button{flex:1;max-width:240px;background:none;border:0;border-radius:12px;padding:6px;font-size:1.2rem}
.tabs button small{display:block;font-size:.72rem;color:var(--mut)}.tabs button.on{background:var(--okbg)}.tabs button.on small{color:var(--jade);font-weight:700}
.fc{background:var(--card);border:1px solid var(--line);border-bottom-width:5px;border-radius:22px;padding:26px 16px;text-align:center;min-height:280px;cursor:pointer;display:flex;flex-direction:column;justify-content:center}
.fc .big{font-size:5rem}.fc small{color:var(--mut)}
.two{display:flex;gap:10px;margin:14px 0}.go.bad{background:var(--red);box-shadow:0 4px 0 #A83030}
.cv{position:relative;width:100%;max-width:320px;aspect-ratio:1;margin:12px auto;background:var(--card);border:2px solid var(--line);border-radius:16px;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:50% 50%;background-position:center}
.cv .gd{position:absolute;inset:0;display:grid;place-items:center;color:var(--mut);opacity:.3;pointer-events:none;line-height:1}
.cv canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.tabs button small{font-size:.66rem}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px}
.cf{flex:none;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:600}.cf.on{background:var(--jade);border-color:var(--jade);color:#fff}
.oc{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;margin-bottom:12px;cursor:pointer}
.oc .row{display:flex;gap:14px;align-items:center}
.tile{flex:none;width:72px;height:72px;perspective:260px}
.tile span{display:grid;place-items:center;width:100%;height:100%;font-size:2.3rem;border-radius:20px;background:linear-gradient(145deg,hsl(var(--h) 85% 72%),hsl(var(--h) 70% 48%));box-shadow:inset 3px 3px 6px hsl(var(--h) 100% 90%/.7),inset -5px -6px 10px hsl(var(--h) 70% 30%/.55),0 10px 0 hsl(var(--h) 65% 34%),0 16px 18px rgba(0,0,0,.25);transform:rotateX(14deg) rotateY(-14deg);transition:transform .3s;filter:saturate(1.1)}
.oc:hover .tile span,.oc.open .tile span{transform:rotateX(0) rotateY(0) translateY(-4px)}
.tile span{text-shadow:0 5px 6px rgba(0,0,0,.35)}
.ot{flex:1;min-width:0}.oz{font-size:1.25rem;font-weight:600}.ot b{display:block;font-weight:600;font-size:.95rem}
.sp{flex:none;width:40px;height:40px;border-radius:50%;border:2px solid var(--line);background:var(--bg)}
.nt{display:none;margin-top:12px;padding:10px 12px;border-radius:12px;background:var(--okbg);font-size:.92rem}.oc.open .nt{display:block}
.tabs button{padding:6px 2px}
</style>

["Tính từ","🌤️","大|dà|Lớn;小|xiǎo|Nhỏ;多|duō|Nhiều;少|shǎo|Ít;新|xīn|Mới;热|rè|Nóng;冷|lěng|Lạnh;高兴|gāoxìng|Vui;漂亮|piàoliang|Xinh đẹp;贵|guì|Đắt","天气,很,冷|tiānqì,hěn,lěng|Thời tiết rất lạnh."],
["Mua sắm","🛍️","钱|qián|Tiền;块|kuài|Đồng (tệ);红色|hóngsè|Màu đỏ;白色|báisè|Màu trắng;黑色|hēisè|Màu đen;蓝色|lánsè|Màu xanh dương;绿色|lǜsè|Màu xanh lá;东西|dōngxi|Đồ vật;便宜|piányi|Rẻ;多少钱|duōshao qián|Bao nhiêu tiền","这个,多少钱|zhège,duōshao qián|Cái này bao nhiêu tiền?"]];
RAW.push(
["Hằng ngày","🌙","睡觉|shuìjiào|Ngủ;工作|gōngzuò|Làm việc;休息|xiūxi|Nghỉ ngơi;开|kāi|Mở, lái;吃饭|chī fàn|Ăn cơm;喝|hē|Uống;坐|zuò|Ngồi;住|zhù|Ở, sống;叫|jiào|Tên là, gọi;做|zuò|Làm","我,每天,工作|wǒ,měitiān,gōngzuò|Tôi làm việc mỗi ngày."],
["Giao thông","🚆","车|chē|Xe;出租车|chūzūchē|Taxi;飞机|fēijī|Máy bay;火车|huǒchē|Tàu hỏa;地铁|dìtiě|Tàu điện ngầm;路|lù|Đường;左|zuǒ|Trái;右|yòu|Phải;走|zǒu|Đi bộ;到|dào|Đến","我,坐,火车|wǒ,zuò,huǒchē|Tôi đi tàu hỏa."],
["Thiên nhiên","🌿","天气|tiānqì|Thời tiết;雨|yǔ|Mưa;雪|xuě|Tuyết;风|fēng|Gió;山|shān|Núi;河|hé|Sông;花|huā|Hoa;狗|gǒu|Chó;猫|māo|Mèo;鸟|niǎo|Chim","我,有,一只,猫|wǒ,yǒu,yì zhī,māo|Tôi có một con mèo."],
["Câu hỏi","❓","什么|shénme|Cái gì;谁|shéi|Ai;几|jǐ|Mấy;怎么|zěnme|Thế nào;为什么|wèishénme|Tại sao;吗|ma|Trợ từ nghi vấn;呢|ne|Còn… thì sao;的|de|Của;很|hěn|Rất;都|dōu|Đều","你,叫,什么|nǐ,jiào,shénme|Bạn tên là gì?"]);
const UNITS=RAW.map(r=>{const[a,b,c]=r[3].split("|");return{t:r[0],e:r[1],w:r[2].split(";").map(x=>x.split("|")),s:[[a.split(","),b.split(","),c]]}});
const ALL=UNITS.flatMap(u=>u.w);
const KEY="hanngu-vui-v1";
let S={xp:0,streak:0,last:"",done:{}};
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const $=s=>document.querySelector(s);
const app=$("#app");
function remote(t){try{const a=new Audio("https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=zh-CN&q="+encodeURIComponent(t));a.play().catch(()=>{})}catch(e){}}
try{speechSynthesis.getVoices();speechSynthesis.addEventListener("voiceschanged",()=>speechSynthesis.getVoices())}catch(e){}
function speak(t){
 try{const ss=window.speechSynthesis,vs=ss?ss.getVoices():[];
  const v=vs.find(x=>/^zh[-_]CN/i.test(x.lang))||vs.find(x=>/^zh/i.test(x.lang));
  if(ss&&(v||!vs.length)){const u=new SpeechSynthesisUtterance(t);if(v)u.voice=v;u.lang=v?v.lang:"zh-CN";u.rate=.8;u.onerror=()=>remote(t);
   ss.cancel();setTimeout(()=>ss.speak(u),80);return}
 }catch(e){}
 remote(t)}
function today(){return new Date().toISOString().slice(0,10)}


function cp(p){const T=[/[āēīōūǖ]/,/[áéíóúǘ]/,/[ǎěǐǒǔǚ]/,/[àèìòùǜ]/],C=["#E5484D","#E58A00","#2E9E5B","#3B6FE0"];
 return p.split(" ").map(x=>{const k=T.findIndex(r=>r.test(x));return `<span style="color:${k<0?"inherit":C[k]}">${x}</span>`}).join(" ")}
let cur=null,flip=false,wcur=null;
const learned=()=>UNITS.flatMap((u,i)=>S.done[i]?u.w:[]);
function nextCard(){const p=learned();if(!p.length){cur=null;return}S.box=S.box||{};
 const so=p.slice().sort((a,b)=>(S.box[a[0]]||0)-(S.box[b[0]]||0));cur=so[Math.floor(Math.random()*Math.min(5,so.length))];flip=false}
function reviewHTML(){
 if(!cur||!learned().includes(cur))nextCard();
 if(!cur)return `<div class="goal" style="text-align:center"><b>Chưa có từ để ôn</b><p style="color:var(--mut)">Hoàn thành ít nhất một bài học, các từ sẽ xuất hiện ở đây.</p></div>`;

let L;
function start(i){
 const u=UNITS[i],qs=[];
 shuf(u.w).forEach((w,k)=>qs.push({type:["zh2vi","vi2zh","listen"][k%3],w}));
 qs.push(...shuf(u.s).map(s=>({type:"build",s})));

 question();
}
function opts(w,key){ // 3 distractors

 if(L.k>=L.qs.length)return finish();

  const [zh,py,vi]=q.s;q.bank=shuf(zh.map((z,j)=>({z,p:py[j],id:j})));

 }else{

  if(q.type==="listen")body=`<h2>Bạn nghe được từ nào?</h2><button class="spk" data-s="${q.w[0]}" style="font-size:2rem;padding:18px 34px">🔊</button>`;
  body+=`<div class="opts">${q.o.map((o,j)=>`<button class="opt" data-j="${j}">${q.type==="zh2vi"?o[2]:`<span class="zh" style="font-size:1.5rem">${o[0]}</span><small>${q.type==="vi2zh"?o[1]:""}</small>`}</button>`).join("")}</div>`;
 }
 app.innerHTML=`<div class="lhead"><button class="x" id="x" aria-label="Thoát">✕</button><div class="bar"><i style="width:${pct}%"></i></div><b>❤️ ${L.hearts}</b></div><div class="q">${body}</div><div class="pad"></div>
 <div class="foot" id="foot"><div><button class="go" id="go" disabled>Kiểm tra</button></div></div>`;
 $("#x").onclick=()=>{if(confirm("Thoát bài học? Tiến độ bài này sẽ mất."))home()};

 if(q.type==="listen"||q.type==="zh2vi")setTimeout(()=>speak(q.w[0]),250);

function drawBuild(q){
 $("#ans").innerHTML=L.built.map(c=>`<button class="chip zh" data-id="${c.id}" data-a="1">${c.z}<small>${c.p}</small></button>`).join("");
 $("#bank").innerHTML=q.bank.map(c=>`<button class="chip zh ${L.built.some(b=>b.id===c.id)?"used":""}" data-id="${c.id}">${c.z}<small>${c.p}</small></button>`).join("");
 document.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{if(L.checked)return;const id=+b.dataset.id,c=q.bank.find(x=>x.id===id);

function check(){
 const q=L.qs[L.k],foot=$("#foot");
 if(L.checked){L.k++;return question()}
 let ok,right;
 if(q.type==="build"){ok=L.built.map(c=>c.id).join()===q.s[0].map((_,j)=>j).join();right=q.s[0].join(" ")}
 else{const c=q.o[L.sel];ok=c[0]===q.w[0];right=q.type==="zh2vi"?q.w[2]:q.w[0]+" ("+q.w[1]+")";
  document.querySelectorAll(".opt").forEach((b,j)=>{if(q.o[j][0]===q.w[0])b.classList.add("ok");else if(j===L.sel)b.classList.add("bad")})}

 else{L.hearts--;L.qs.push(Object.assign({},q,{o:null}));L.total++}
 foot.className="foot "+(ok?"ok":"bad");

 if(L.hearts<=0){foot.querySelector(".go").textContent="Hết tim – học lại";$("#go").onclick=()=>start(L.i)}
}
function finish(){

 save();
 app.innerHTML=`<div class="end"><div class="big">🏆</div><h1>Hoàn thành bài ${L.i+1}!</h1><p style="color:var(--mut)">${UNITS[L.i].t}</p>
 <div class="sum"><div>⭐ +${xp} XP</div><div>❤️ ${L.hearts} tim</div><div>🔥 ${S.streak} ngày</div></div>

 $("#back").onclick=home;
}
